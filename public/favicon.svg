<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Identidade estúdio: branco e grafite. Fundo claro para aparecer em aba escura e clara. -->
  <rect width="64" height="64" rx="15" fill="#f5f5f7"/>
  <!-- Sofá em quatro peças separadas por um fio de luz: encosto, assento e dois braços -->
  <g fill="#0d0e10">
    <rect x="20" y="11" width="24" height="18" rx="6"/>
    <rect x="20" y="31" width="24" height="11" rx="2.5"/>
    <rect x="7" y="20" width="11" height="22" rx="5"/>
    <rect x="46" y="20" width="11" height="22" rx="5"/>
  </g>
  <!-- Cota: a medida embaixo do móvel -->
  <path d="M9 48v7M55 48v7M9 51.5h46" fill="none" stroke="#0d0e10" stroke-width="3" stroke-linecap="round"/>
</svg>
