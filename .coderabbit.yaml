# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "pt-BR"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!package-lock.json"
    - "!dist/**"
    - "!public/images/**"
  path_instructions:
    - path: "src/components/furniture/**"
      instructions: >-
        Escala real é sagrada: a caixa envolvente do móvel deve bater com as
        medidas recebidas. Toda proporção deve ser constante nomeada. Peças vêm
        de parts.ts; materiais, da paleta MATERIALS. Unidade interna é metro.
    - path: "src/**/*.{ts,tsx}"
      instructions: >-
        Siga o CONTRIBUTING.md: sem any, dados imutáveis, unidade no nome
        (Cm ou M), sem número mágico, funções curtas, erros nunca engolidos.
    - path: "src/**/*.css"
      instructions: >-
        Use os tokens de :root. A identidade "estúdio" é branco sobre grafite:
        a única cor é a luz quente (--color-light); verde, âmbar e vermelho só
        no veredito. Nada de azul nem de fundo claro. Classes em BEM.
chat:
  auto_reply: true
